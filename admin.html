<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Stock manager | Haven House Co.</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel h2{font-size:21px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:320px 1fr;gap:24px;padding:32px 0 56px;align-items:start}
label{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
.f{margin-bottom:14px}
.f input,.f select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);font:inherit;background:#fff}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row img{width:56px;height:56px;object-fit:cover;border-radius:var(--r);background:#e6e4dc}
.row div{flex:1;min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted)}
.del{background:none;border:1px solid #a3322b;color:#a3322b;border-radius:var(--r);padding:8px 12px;font:600 14px "Hanken Grotesk",sans-serif;cursor:pointer}
.del:hover{background:#f6e4e2}
.note{font-size:14px;margin-top:12px;min-height:21px}
.note.err{color:#a3322b}.note.ok{color:var(--green)}
#login{max-width:380px;margin:12vh auto;padding:0 20px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login">
  <div class="panel">
    <h2>Sign in to manage stock</h2>
    <form id="loginForm">
      <div class="f"><label for="email">Email</label><input type="email" id="email" required autocomplete="username"></div>
      <div class="f"><label for="pw">Password</label><input type="password" id="pw" required autocomplete="current-password"></div>
      <button class="btn" type="submit" style="width:100%">Sign in</button>
      <p class="note err" id="loginMsg" role="alert"></p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="site"><div class="wrap">
    <span class="brand">Stock manager<small>Haven House Co.</small></span>
    <span><a class="btn plain" href="./">View store</a> <button class="btn plain" id="out" type="button">Sign out</button></span>
  </div></header>
  <main class="wrap"><div class="cols">
    <section class="panel">
      <h2>Add an item</h2>
      <form id="addForm">
        <div class="f"><label for="title">Item name</label><input id="title" required placeholder="Royal Windsor teacup set"></div>
        <div class="f"><label for="category">Category</label><select id="category">
          <option>Dining Tables</option><option>Carpets &amp; Mats</option><option></option><option>Art</option><option>Lounge Umbrellas</option><option>Flower Decor</option><option>General Decor</option><option>Cups &amp; Mugs</option><option>Cutlery</option></select></div>
        <div class="f"><label for="condition">Condition</label><select id="condition">
          <option>Ex-UK Like New</option><option>Ex-UK Gently Used</option><option>Ex-UK Brand New Boxed</option></select></div>
        <div class="f"><label for="file">Photo</label><input type="file" id="file" accept="image/*" required></div>
        <button class="btn" id="add" type="submit" style="width:100%">Add to store</button>
        <p class="note" id="addMsg" role="status"></p>
      </form>
    </section>
    <section class="panel">
      <h2>Items in stock</h2>
      <div id="list"></div>
    </section>
  </div></main>
</div>

<script>
const db = supabase.createClient("https://hjyoerprtwbhlhganytc.supabase.co", "sb_publishable_dmgJAH7hliaKjaXdJIaD2w_aD0xuuG2");
const $ = id => document.getElementById(id);
const say = (id, text, cls) => { $(id).textContent = text; $(id).className = "note " + (cls || ""); };

function show(signedIn) { $("login").hidden = signedIn; $("app").hidden = !signedIn; if (signedIn) load(); }

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const { error } = await db.auth.signInWithPassword({ email: $("email").value, password: $("pw").value });
  if (error) say("loginMsg", "Sign in failed. Check the email and password.", "err"); else show(true);
});
$("out").onclick = async () => { await db.auth.signOut(); show(false); };

$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const file = $("file").files[0];
  if (!file.type.startsWith("image/")) return say("addMsg", "Choose an image file.", "err");
  if (file.size > 8 * 1024 * 1024) return say("addMsg", "Photo is over 8 MB. Use a smaller photo.", "err");
  $("add").disabled = true;
  say("addMsg", "Adding...");
  try {
    const name = `${Date.now()}.${file.name.split(".").pop().toLowerCase()}`;
    const up = await db.storage.from("product-images").upload(name, file);
    if (up.error) throw up.error;
    const url = db.storage.from("product-images").getPublicUrl(name).data.publicUrl;
    const ins = await db.from("products").insert([{ title: $("title").value.trim(), category: $("category").value, condition: $("condition").value, image_url: url }]);
    if (ins.error) throw ins.error;
    $("addForm").reset();
    say("addMsg", "Added to store.", "ok");
    load();
  } catch (err) {
    say("addMsg", "Could not add the item: " + err.message, "err");
  } finally { $("add").disabled = false; }
});

async function load() {
  const { data, error } = await db.from("products").select("*").order("id", { ascending: false });
  const box = $("list");
  box.replaceChildren();
  if (error) { box.textContent = "Could not load items: " + error.message; return; }
  if (!data.length) { box.textContent = "No items yet. Add the first one."; return; }
  data.forEach(p => {
    const img = Object.assign(document.createElement("img"), { src: p.image_url, alt: "" });
    const info = document.createElement("div");
    const b = document.createElement("b"); b.textContent = p.title;
    const s = document.createElement("small"); s.textContent = `${p.category}, ${p.condition}`;
    info.append(b, s);
    const del = Object.assign(document.createElement("button"), { className: "del", type: "button", textContent: "Delete" });
    del.onclick = () => remove(p);
    const row = document.createElement("div"); row.className = "row";
    row.append(img, info, del);
    box.append(row);
  });
}

async function remove(p) {
  if (!confirm(`Delete "${p.title}" from the store?`)) return;
  const { error } = await db.from("products").delete().eq("id", p.id);
  if (error) return alert("Could not delete: " + error.message);
  const path = (p.image_url || "").split("/product-images/")[1];
  if (path) await db.storage.from("product-images").remove([decodeURIComponent(path)]);
  load();
}

db.auth.getSession().then(({ data }) => show(!!data.session));
</script>
</body>
</html>
